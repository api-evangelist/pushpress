description: >-
  FinOps view of PushPress spend. PushPress is a per-location SaaS: cost is
  driven primarily by a fixed monthly subscription per gym location (Free, Pro,
  or Max), plus optional per-product add-ons (Train, Grow, Branded App), plus
  usage-based payment processing fees on client billing run through the
  platform. The Platform API and webhooks are included in the subscription and
  are not separately metered, so API adoption does not create a distinct
  line-item cost - the cost model is seat/location subscription and transaction
  processing.
notes: >-
  Per-unit figures are not reconciled here; verify subscription tiers, add-on
  pricing, and processing rates on the PushPress pricing page. For multi-location
  operators the dominant cost lever is the number of locations times plan tier,
  followed by payment processing volume.
