meters:
- name: location_subscription
  description: Fixed monthly subscription per gym location (Free / Pro / Max tier).
  unit: locations
  aggregation: sum
  dimensions:
  - account
  - location
  - plan
- name: addon_subscription
  description: Monthly fee per enabled product add-on (Train, Grow, Branded App).
  unit: addons
  aggregation: sum
  dimensions:
  - account
  - location
  - addon
- name: payment_processing
  description: Per-transaction card and ACH processing fees on client billing.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - location
  - method
principles:
- name: Visibility
  description: Track subscription and add-on charges per location and processing fees per transaction method.
- name: Allocation
  description: Map each location's subscription, add-ons, and processing volume to the responsible gym / franchise cost center.
- name: Optimization
  description: Right-size each location's plan tier, disable unused add-ons, and steer client billing toward lower-cost ACH where appropriate.
- name: Accountability
  description: Review monthly per-location subscription plus processing spend against membership revenue.
