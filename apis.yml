aid: pushpress
url: https://raw.githubusercontent.com/api-evangelist/pushpress/refs/heads/main/apis.yml
name: PushPress
kind: company
description: PushPress is a gym and fitness business management platform covering
  membership management, billing and payments, class and appointment scheduling,
  check-ins, CRM, and a member app. The PushPress Platform API is a REST API
  (base https://api.pushpress.com/v3) that lets developers read and manage
  customers (members), check-ins, appointments, classes, events, plan
  enrollments, membership plans, invitations, and transactional messaging, and
  subscribe to platform webhooks for real-time events. Requests are
  authenticated with an API key in the API-KEY header and scoped to a single gym
  location with a company-id header.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
